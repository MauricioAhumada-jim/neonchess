name: Build Android App

on:
  push:
    branches:
      - android-app
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Sign Release APK
        if: ${{ env.SIGNING_KEY != '' }}
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Sign Release AAB
        if: ${{ env.SIGNING_KEY != '' }}
        uses: r0adkll/sign-android-release@v1
        id: sign_aab
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Auto-Generate Keystore and Sign (If No Secrets Configured)
        if: ${{ env.SIGNING_KEY == '' }}
        run: |
          if [ -f "android/app/neonchess.keystore" ]; then
            echo "Found existing keystore in repository. Reusing it."
          else
            echo "No keystore found. Generating new keystore."
            keytool -genkey -v -keystore android/app/neonchess.keystore -alias neonchess-key -keyalg RSA -keysize 2048 -validity 10000 -storepass neonchess123 -keypass neonchess123 -dname "CN=Neon Chess, O=Neon Chess, C=US"
          fi
          
          # Sign APK
          APK_FILE=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ ! -z "$APK_FILE" ]; then
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 -keystore android/app/neonchess.keystore -storepass neonchess123 -keypass neonchess123 "$APK_FILE" neonchess-key
            echo "Signed APK successfully: $APK_FILE"
          fi
          
          # Sign AAB
          AAB_FILE=$(find android/app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
          if [ ! -z "$AAB_FILE" ]; then
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 -keystore android/app/neonchess.keystore -storepass neonchess123 -keypass neonchess123 "$AAB_FILE" neonchess-key
            echo "Signed AAB successfully: $AAB_FILE"
          fi

      - name: Upload Signing Keystore Backup
        if: ${{ env.SIGNING_KEY == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-signing-keystore-backup
          path: android/app/neonchess.keystore

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

